name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Liquid Glass needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release app bundle
        run: Scripts/build.sh
